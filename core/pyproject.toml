[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelot-studio-core"
version = "0.1.0"
description = "Camelot Studio — DAoC client asset editing tools (NIF, KFA, MPAK, gamedata tables)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyffi>=2.2.3",
    "setuptools>=68",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[project.scripts]
camelot = "camelot.cli:main"

[tool.setuptools]
packages = ["camelot"]