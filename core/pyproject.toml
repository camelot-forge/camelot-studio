[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelot-studio-core"
version = "0.1.0"
description = "Camelot Studio — DAoC client asset editing tools (NIF, KFA, MPAK, gamedata tables)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyffi>=2.2.3",
    "setuptools>=68",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/camelot-forge/camelot-studio"
Issues = "https://github.com/camelot-forge/camelot-studio/issues"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "watchfiles>=1.0"]
#: `camelot server export` and `camelot serve --db-config` read the server's
#: own MySQL; without it, the viewer works from an exported snapshot (spec §5).
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff==0.17.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
# Two tiers, one switch (the tag is applied in `tests/conftest.py` to every
# test that asks for the `client_dir` fixture — those read the real ~5 GB
# client and hold all the wall-clock time):
#   inner loop    : pytest -q -m "not corpus"      (~8 s)
#   before commit : pytest -q                      (the full corpus walk)
#   parallel      : pytest -q -n 6 --dist loadfile (~2.5 min, needs xdist)
markers = [
    "corpus: needs the real DAoC client ($DAOC_CLIENT) — the slow tier",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["camelot"]

[project.scripts]
camelot = "camelot.cli:main"

[tool.setuptools.packages.find]
include = ["camelot*"]
