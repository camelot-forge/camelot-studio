name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The same extras bootstrap.sh installs: the serve tests import
          # fastapi/httpx, and the database readers import pymysql.
          pip install -e "core[dev,server,mysql]"

      # pyffi 2.2.3 predates Python 3.12 (time.clock removal); the venv
      # bootstrap does the same patch — see bootstrap.sh.
      - name: Patch pyffi for modern Python
        run: |
          SP=$(python -c "import pyffi, os; print(os.path.dirname(pyffi.__file__))")
          sed -i 's/time\.clock()/time.perf_counter()/g' \
            "$SP/object_models/xml/__init__.py" \
            "$SP/object_models/xsd/__init__.py"

      - name: Lint
        run: ruff check core/camelot core/tests

      - name: Test (unit tier)
        # Corpus tests skip automatically: DAOC_CLIENT is not set here
        # (game assets never enter CI).
        run: python -m pytest core/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Types and Svelte
        working-directory: web
        run: pnpm check

      - name: Unit tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Lint
        working-directory: web
        run: pnpm lint
