# The players' launcher, built on Windows (F §D5): PyInstaller does not
# cross-compile, and the artifact is what a closed test hands out.
#
# Run it from the Actions tab: the version only moves forward (a package with a
# greater one replaces a player's, `deployment.md` §D7), so bump it before
# every hand-out. The two files it publishes are the zip and the manifest the
# launcher fetches from the shard's `launcher` URL.
name: launcher-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the launcher's own version (a greater one replaces a player's)"
        required: true
        default: "1"
      name:
        description: "the shard's display name"
        required: true
        default: "Camelot Hills"
      feed:
        description: "the shard's public feed URL, ending with /"
        required: true
        default: "https://patch.example/"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      # The page is committed (`web/launcher/dist`), so this job needs no Node:
      # what it builds is the process, the page as it stands, and the shard file.
      - name: Build
        shell: pwsh
        run: |
          python packaging/launcher/build.py `
            --name "${{ inputs.name }}" `
            --feed "${{ inputs.feed }}" `
            --version "${{ inputs.version }}"

      - name: Check the package
        shell: pwsh
        run: |
          $zip = "packaging/dist/camelot-launcher-win32.zip"
          if (-not (Test-Path $zip)) { throw "$zip was not built" }
          $manifest = Get-Content packaging/dist/launcher-manifest.json | ConvertFrom-Json
          if ($manifest.version -ne [int]"${{ inputs.version }}") { throw "manifest version" }
          if (-not $manifest.sha256.StartsWith("sha256:")) { throw "manifest hash" }

      - uses: actions/upload-artifact@v4
        with:
          name: camelot-launcher-win32-${{ inputs.version }}
          if-no-files-found: error
          path: |
            packaging/dist/camelot-launcher-win32.zip
            packaging/dist/launcher-manifest.json
